spring:
  datasource:
    # En la nube usa la variable, en local usa localhost
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/gymapp}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect